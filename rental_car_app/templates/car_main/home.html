{%extends 'partials/base.html'%}

{% load static %} 
{%block content%}
<div class="mbl_main_container relative w-full min-h-screen flex items-center justify-center bg-opacity-70" style="font-family: 'chillax'; background:#EFF2F1">
  <!-- Background image with dark overlay -->
  <div class="mbl absolute inset-2 bg-center" style="background:#EFF2F1;">
    <div class="absolute inset-0  bg-opacity-60"></div>
  </div>

  <!-- Content layer -->
  <div class="for_mob relative z-10 w-full max-w-[1200px] px-4 py-10 mt-[10px] flex flex-col items-center text-center">
    <div class="title">
        <h1 class="mb-4">Drive Luxury</h1>
        <h1 class=" mb-4">Experience Aspen</h1>
        <span class="mb-[40px]" style="color: #f4b942; font-size: 14px; font-weight: 500;">
          Localy owned & operated car rental service in Aspen, Colorado.
        </span>
    </div>
    <!-- Booking form -->
    <div class="frm w-[100%] backdrop-blur-sm rounded-2xl p-8">
      <form method="POST" id="car-availability-form"  action="{% url 'booking:check_car_availability' %}" class="flex flex-col md:flex-row md:justify-evenly mt-[10px] md:items-end gap-4">
        {% csrf_token %}
        <input type="hidden" name="car-id" value="{{ car.id }}">

      <div class="delivery_location">
        <label class="text-white text-[16px]" style="align-items: center"><i class="fa-sharp fa-solid fa-location-dot" style="color: #FFD43B;">&nbsp;</i>Delivery Location</label>
        <img style="
                    top: 30px; left: 95%;
                    position: relative;
                    width: 14px;"
                    src="/media/down-arrow.png" alt="">
        <select name="delivery_location" id="delivery_location" class="delivery_selection" required>
            <option value="" style="font-size: 14px;">Select location</option>
                {% for loc in locations %}
                  <option value="{{ loc.id }}">{{ loc.delivery_address }}</option>
                  {% endfor %}
        </select>
      </div>

        <!-- Pick-up -->
      <div class="flex flex-col space-y-2">
        <label class="text-white text-[16px]" style=" align-items: center;"><i class="fa-solid fa-calendar-days" style="color: #FFD43B;">&nbsp;</i>Pick-up date & Time</label>
        <div class="flex">
        
            <!-- Custom Date Input with Visible Placeholder -->
            <div class="relative w-[160px]">
              <input 
                type="date" 
                id="checkin" 
                name="checkin"
                placeholder="Select date"
                class="peer date_selection text-[14px] rounded-lg p-2.5 w-full appearance-none focus:outline-none"
                required>
                <!-- <span class="date-placeholder" id="checkin-placeholder">Select date</span> -->
            </div>

            <!-- Time Input (normal, mobile works fine) -->
            <input 
              type="time" 
              name="time_in" 
              class="date_selection time text-[14px] rounded-lg p-2.5 w-[130px] focus:outline-none">

        </div>
      </div>

 

        <!-- Return -->
        <div class="flex flex-col space-y-2">
        <label class="text-white text-[16px]" style="align-items: center";><i class="fa-solid fa-house" style="color: #FFD43B;">&nbsp;</i>Return date & Time</label>
          <div class="flex ">

              <!-- Custom Date Input with visible mm/dd/yyyy -->
            <div class="relative w-[160px]">
              <input 
                type="date" 
                id="checkout" 
                name="checkout"
                class="peer date_selection text-[14px] rounded-lg p-2.5 w-full appearance-none focus:outline-none"
                required>
              <span class="date-placeholder" id="checkin-placeholder">Select date</span>
            </div>

            <!-- Time Input -->
            <input 
              type="time" 
              name="time_out" 
              class="date_selection time text-[14px] rounded-lg p-2.5 w-[130px] focus:outline-none">
            
          </div>
        </div>
      </form>
      
              <!-- Submit -->
      <div class="flex items-end justify-center">
        <button type="submit" 
          form="car-availability-form" 
          class="btn text-white px-6 py-3">
          <i class="fa-solid fa-magnifying-glass">&nbsp;&nbsp;</i>
          Find a car
        </button>
      </div>
    </div>
    <p class="log_in">Already Have an Account?</p><a href="{% url 'user_auths:sign-in'%}" class="sign-in hover:underline"> Sign in</a>
  </div>
</div>

        
<style>



  .log_in{
    color: #6b9bc4c4;
    margin-top: 20px;
    font-size: 14px;
  }


  .sign-in{
    text-decoration: underline;
    font-size: 14px;
    font-weight: 500;
  }

  .delivery_selection{
    -webkit-appearance: none;
    -moz-appearance: none;
    appearance: none;
    color: #4059AD;
    height: 45px;;
    border:1px solid #4059AD;
    border-radius: 10px;
    width: 340px;
    font-size: 14px;
    padding:5px
  }

  .date_selection{
    -webkit-appearance: none;
    -moz-appearance: none;
    appearance: none;
    color: #4059AD;
    height: 45px;;
    border:1px solid #4059AD;
    border-radius: 10px 0px 0px 10px;
    font-size: 14px;
  }

  input[type="date"]::-webkit-datetime-edit-text,
  input[type="date"]::-webkit-datetime-edit-month-field,
  input[type="date"]::-webkit-datetime-edit-day-field,
  input[type="date"]::-webkit-datetime-edit-year-field {
    display: none;
  }
  .date-placeholder {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: #4059AD;
    pointer-events: none;
    font-size: 14px;
}

.date-placeholder.hidden {
    display: none;
}

  .time{
    border-radius: 0px 10px 10px 0px;
  }

  .frm{
    
    height: 240px;
    background: #6b9ac473;
    box-shadow: 10px 10px 14px -2px rgba(0, 0, 0, 0.3);
  }
  label{
    display: flex;
    justify-content: start;
  }
  h1{
    color:  #4059AD;
    font-size: 50px;
    margin-right: 10px;
  }

  .title{
    display:flex;
    flex-direction: column;
  }

  .date{
    size: 18px;
  }

  .btn{
       padding: 15px 20px;
    border: 2px solid #4059ad;
    color: #546bb5;
    border-radius: 20px;
    transition: all 0.5s ease;
    height: 52px;
    align-items: center;
    display: flex;
    justify-content: center;
    width: 92%;
    margin-top: 40px;
    background: #EFF2F1;
  }
  .btn:active{
 
    color: rgb(0, 0, 0);
    border: 2px solid black;

  }

@media screen and (max-width: 460px){

  .for_mob{
    margin-top: 80px;
  }

  input.date_selection{
    color: #4059AD;
    
  }
  input.date_selection,
    input[type="date"],
    input[type="time"] {
        color: #4059AD !important;
        -webkit-text-fill-color: #4059AD !important;
        background-color: none !important;
        font-size: 14px;
        width:180px;
    }

  input[type="date"]::-webkit-datetime-edit-text,
  input[type="date"]::-webkit-datetime-edit-month-field,
  input[type="date"]::-webkit-datetime-edit-day-field,
  input[type="date"]::-webkit-datetime-edit-year-field {
    display: inline-block;
  }
  h1{
    font-size: 40px;
    margin:0px 0px 5px 0px;
  }

  .mbl_main_container{
    width: 100%;
    height: 100%;
  }

  .mbl{
    width:100%;
    height: 53%;
    position: fixed;
  }

  .frm{
    display: flex;
    flex-direction: column;
    width: 100%;
    align-items: center;
    height: 100%;
  }

  .title{
    flex-direction: column;
  }

  .form{
    align-items: start;
    margin-top:-20px;
    backdrop-filter: blur(2px);
    height: 45%;
  }

  .btn{
    margin-top:20px;
    width: 340px;
  }
}
 
</style>

<script>

  

document.addEventListener("DOMContentLoaded", function () {
  const checkinInput = document.getElementById("checkin");
  const checkoutInput = document.getElementById("checkout");

  // Set today's date as min for check-in
  const today = new Date();
  const formattedToday = today.toISOString().split("T")[0];
  checkinInput.min = formattedToday;

  // When user picks a check-in date, update checkout min accordingly
  checkinInput.addEventListener("change", function () {
    const checkinDate = new Date(this.value);
    checkinDate.setDate(checkinDate.getDate() + 1); // Checkout must be at least next day
    const formattedNextDay = checkinDate.toISOString().split("T")[0];
    checkoutInput.min = formattedNextDay;

    // If checkout is before the new min, reset it
    if (checkoutInput.value < formattedNextDay) {
      checkoutInput.value = formattedNextDay;
    }
  });

  // Set initial checkout min date as tomorrow
  const initialCheckout = new Date();
  initialCheckout.setDate(initialCheckout.getDate() + 1);
  checkoutInput.min = initialCheckout.toISOString().split("T")[0];
});

document.addeventlistener("DOMContentLoaded", function(){
  const timeIn = document.getElementById("timeIn");
  const timeOut = docuemnt.getElementById("timeOut");

  function isTimeResctricted(value) {
    const [hours, minutes] = value.split(":").map(Number);
    const totalMinutes = hours * 60 + minutes;
    const restictedStart = 23 * 60;
    const restrictedEnd = 7 * 60;

    return (totalMinutes >= restrictedStart || totalMinutes < restrictedEnd);
  }

  function validateTime(input){
    const time = inpit.value;
    if (isTimeRestricted(time)){
      alert("Please select a time between 7:00 AM and 11:00 PM.");
      inpit.value = "";
    }
  }

  timeIn.addEventListener("change", () => validateTime(timeIn));
  timeOut.addEventListener("change", () => validateTime(timeOut));
})
</script>
        {%endblock content%}
